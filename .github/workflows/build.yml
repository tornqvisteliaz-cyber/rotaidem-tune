name: Build Rotaidem Tune

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore src-csharp/RotaidemTune/RotaidemTune.csproj

    - name: Publish single-file exe
      run: |
        dotnet publish src-csharp/RotaidemTune/RotaidemTune.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -o publish

    - name: Upload RotaidemTune.exe
      uses: actions/upload-artifact@v4
      with:
        name: RotaidemTune-win-x64
        path: |
          publish/RotaidemTune.exe
          publish/Assets/**
        if-no-files-found: warn
